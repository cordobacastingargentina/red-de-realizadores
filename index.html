<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red de Realizadores — Córdoba Casting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" data-route="home">
      <span class="brand-mark">RR</span>
      <span class="brand-copy"><strong>RED DE REALIZADORES</strong><small>una iniciativa de Córdoba Casting</small></span>
    </a>
    <nav>
      <a href="#home" data-route="home">Realizadores</a>
      <a href="#recursos" data-route="recursos">Recursos</a>
      <a href="#formacion" data-route="formacion">Formación</a>
      <button class="ghost" id="openAccountBtn">Ingresar</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer>
    <div>
      <strong>CÓRDOBA CASTING</strong>
      <span> / Red de Realizadores</span>
    </div>
    <small>V0.1 · Prototipo navegable con datos demo</small>
  </footer>

  <div class="modal-backdrop hidden" id="modalBackdrop"></div>
  <div class="modal hidden" id="modal">
    <button class="modal-close" id="closeModalBtn" aria-label="Cerrar">×</button>
    <div id="modalContent"></div>
  </div>

  <template id="homeTemplate">
    <section class="hero wrap">
      <div class="eyebrow">RED PROFESIONAL AUDIOVISUAL · CÓRDOBA</div>
      <h1>Encontrá a quien<br><span>hace la película.</span></h1>
      <p>Directores, fotógrafos, guionistas, sonidistas, montajistas, productores y más. Perfiles simples, roles claros y material de trabajo a un click.</p>
    </section>

    <section class="filters wrap">
      <div class="search-box">
        <label for="searchInput">Buscar</label>
        <input id="searchInput" type="search" placeholder="Nombre, rol o palabra clave…" />
      </div>
      <div class="filter-row">
        <select id="roleFilter">
          <option value="">Todos los roles</option>
        </select>
        <label class="check"><input type="checkbox" id="availableFilter"> Disponible actualmente</label>
        <label class="check"><input type="checkbox" id="studentFilter"> Acepta estudiantiles</label>
      </div>
    </section>

    <section class="directory wrap">
      <div class="directory-head">
        <div><span id="resultsCount">0</span> perfiles</div>
        <button class="primary" id="createProfileBtn">Crear mi perfil</button>
      </div>
      <div class="cards" id="cardsContainer"></div>
    </section>
  </template>

  <template id="resourcesTemplate">
    <section class="page wrap narrow">
      <div class="eyebrow">RECURSOS</div>
      <h1>Material útil para realizar.</h1>
      <p class="lead">Una biblioteca simple de herramientas para rodajes, preproducción y trabajo colaborativo. En esta versión son contenidos demo para mostrar la estructura.</p>
      <div class="resource-grid">
        <article><span>01</span><h3>Checklist de rodaje</h3><p>Una guía corta para revisar equipo, permisos, continuidad y logística antes de salir a filmar.</p><button class="text-btn">Ver recurso →</button></article>
        <article><span>02</span><h3>Plantilla de plan de rodaje</h3><p>Modelo base para organizar escenas, jornadas, locaciones y necesidades de equipo.</p><button class="text-btn">Ver recurso →</button></article>
        <article><span>03</span><h3>Guía de casting</h3><p>Cómo preparar una convocatoria, pedir material y organizar pruebas de manera clara.</p><button class="text-btn">Ver recurso →</button></article>
      </div>
    </section>
  </template>

  <template id="trainingTemplate">
    <section class="page wrap narrow">
      <div class="eyebrow">FORMACIÓN · CÓRDOBA CASTING</div>
      <h1>Aprender también es parte del oficio.</h1>
      <p class="lead">Cursos y talleres vinculados al audiovisual, la dirección y el trabajo con actores.</p>
      <div class="course-list">
        <article><div><span class="tag">CURSO</span><h3>Dirección actoral para cámara</h3><p>Introducción práctica al vínculo entre puesta, actuación y dirección.</p></div><button class="outline">Más información</button></article>
        <article><div><span class="tag">TALLER</span><h3>Taller de escenas</h3><p>Entrenamiento y filmación de escenas para actores con experiencia previa.</p></div><button class="outline">Más información</button></article>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
